schema_version: 2
name: "cdse_cdcl2_bridge_first"
description: >
  Experimental pack: sequential skeleton_bridge_first passivation only.
  Same bond/angle tables as cdse_cdcl2_molecular; high-p passivation and
  optional DFT-collapse filters are OFF so they cannot interfere with the
  sequential placer. Proper torsions are preferred when DFT shows a peak;
  flat torsions are ranked by soft clearance. Default multiset pack is unchanged.
source: "tools/mine_cdse_dft_geometry.py (geometry tables); sequential mode experiment"
# Acceptance band for a finished molecule.  A constructed structure has to be
# reasonable, not exact: the rigid 6-ring template pins ring bonds at
# bond_cdse_A (2.69) while the CN table gives 2.649 for Cd(cn4)-Se(cn3), so any
# bond band below ~0.041 rejects ring structures by construction.  Values follow
# the ~2-sigma convention used by RDKit/ETKDG, CORINA and OMEGA; the angle band
# matches the p10/p90 windows recorded in by_role_signature below.  Omit any key
# to fall back to the code default.
tolerances:
  audit_bond_A: 0.05
  audit_angle_deg: 8.0
  # Improper auditing is OFF for this pack, and deliberately so.  The improper
  # at a CN3 centre is fully determined by the three pairwise angles at that
  # centre; the only extra information it carries is the sign, which is a
  # mirror image with no chemistry attached here.  Auditing both therefore
  # over-constrains the centre -- and the two disagree in this pack.  Three
  # angles sum to 360 deg only when the centre is planar, but the DFT medians
  # under angles.Cd.cn3.by_signature sum to:
  #     Cl1Se2  348.3 deg -> implies a 26.5 deg improper
  #     Cl2Se1  328.6 deg -> implies a 48.4 deg improper
  #     Se3     353.5 deg -> implies a 22.2 deg improper
  #     Cl3     368.0 deg -> not realizable at all (>360)
  # while dihedrals.improper.Cd.cn3 declares 0.0 (planar) for every one of
  # them.  Those angles are all soft, so the improper was the sole hard local
  # constraint and it contradicted the data behind the rest of the pack.
  # Set a number here to re-enable the check if the improper table is remined.
  audit_improper_deg: null
graph_rules:
  require_inorganic_connected: true
  enforce_min_cn: true
  coordination:
    Cd: {min: 2, max: 4}
    Se: {min: 2, max: 4}
    Cl: {min: 1, max: 3}
  pair_rules:
    Cd-Se: {bond: allowed, bond_max_distance: 3.25}
    Cd-Cl: {bond: allowed, bond_max_distance: 3.10}
    Cd-Cd: {bond: forbidden, min_distance: 3.20}
    Se-Se: {bond: forbidden, min_distance: 3.80}
    Cl-Cl: {bond: forbidden, min_distance: 2.70}
    Cl-Se: {bond: forbidden, min_distance: 2.70}
  allowed_neighbor_signatures:
    Cl: [Cd1, Cd2, Cd3]
  # --- Sequential bridge-first only (do not mix multiset / tet / pack_sites) ---
  decoration_mode: skeleton_bridge_first
  bridge_first_p1_terminal_policy: unrestricted
  # Built into the sequential placer (bridge rules), not extra ranking:
  #   - at most one μ2 Cl per Cd–Cd pair
  #   - both hosts of a bridge must finish CN ≥ 3
  #   - mono-Se Cd: no dual-terminal without a bridge
  #   - prefer ≤2 bridges/Cd, hard max 3 (code defaults; not YAML yet)
  max_shared_ligands_per_host_pair: 1
  # Hard Cd--Cd host span for a μ2 bridge candidate.  Omit or set null to
  # use the historical conservative radius-derived span instead.
  bridge_cd_cd_max_distance: 4.75
  min_bridged_host_cn: 3
  forbid_mono_se_dual_terminal: true
  min_ring_size:
    Cd-Se: 6
  # --- OFF: do not stack on sequential order ---
  # High-p “all Cd ≥ 3” floor (would reject leftover CN2 independently of
  # the sequential tiers). p_ge=100 = never applies.
  passivate_min_cd_cn_k_ge: 2
  passivate_min_cd_cn_p_ge: 100
  passivate_min_cd_cn: 3
  # Optional post-hoc DFT-collapse filters (keep false for a pure sequential run)
  reject_closable_terminal_cd2: false
  closable_terminal_cd2_distance: 3.50
  require_bridge_maximal: false
  forbid_cdse_cn_pairs: []
  # When composition can host min stable 6-ring Cd[3,3,4] Se[3,3,3], try a
  # closed Cd3Se3 seed first. If passivation accepts nothing, fall back to
  # free (open) skeletons. Once a k succeeds with rings, later p stay ring-only.
  ring_first_when_pattern_possible: true
  ring_first_fallback_to_open: true
  multi_ring_ladder: true
  ring_min_pattern_cd: [3, 3, 4]
  ring_min_pattern_se: [3, 3, 3]
# Cd–Se 6-ring construction targets (chair/boat only, not a DFT relaxation).
# Values are DFT-derived ring averages/phase-aligned sequences.
# Seeds are 6-rings only (fused 6-rings OK). Non-ring atoms use pack bond/angle tables.
rings:
  cdse_6:
    conformations: [chair, boat]
    default_pattern: default
    patterns:
      # These two angles are a DFT average over the cd_cn/se_cn pattern below,
      # and they are very nearly the CN-weighted mean of this pack's own per-CN
      # tables: (117.831*2 + 109.5)/3 = 115.05 vs 116.5 stated for Cd, and
      # 89.245 vs 89.5 stated for Se.  The builder therefore treats them as the
      # value at RING_CN_REFERENCE (=3) and interpolates each ring atom's angle
      # linearly in its own coordination number up to the tetrahedral
      # 109.4712 deg at CN4, so a saturated ring collapses onto the bulk ZB
      # chair (measured from the ZB CIF: 109.47 deg at both Cd and Se, with
      # exactly alternating +/-60 deg dihedrals).
      #
      # This deliberately overrides angles.Se.cn4 (97.446, 12 deg short of
      # tetrahedral) and angles.Se.cn5 (83.324, below cn2 -- non-monotonic).
      # Those come from small strained clusters and are not a usable saturated
      # limit.  A relaxation will close the angles up again; the construction
      # just starts on the correct side of the bulk limit.
      default:
        cd_cn: [3, 3, 4]
        se_cn: [3, 3, 3]
        bond_cdse_A: 2.69
        angle_at_cd_deg: 116.5
        angle_at_se_deg: 89.5
    # Endocyclic DFT-derived sequences distinguish chair from boat.
    dihedrals:
      chair: [60.8, -66.6, 61.7, -64.5, 70.8, -65.6]
      boat: [-6.5, 79.8, -82.3, 16.3, 18.7, -32.1]
bonds:
  - {pair: CdCl_bridge, cn_cd: 3, cn_other: 2, r_A: 2.536}
  - {pair: CdCl_bridge, cn_cd: 3, cn_other: 3, r_A: 2.711}
  - {pair: CdCl_bridge, cn_cd: 4, cn_other: 2, r_A: 2.541}
  - {pair: CdCl_bridge, cn_cd: 4, cn_other: 3, r_A: 2.721}
  - {pair: CdCl_bridge, cn_cd: 4, cn_other: 4, r_A: 2.899}
  - {pair: CdCl_bridge, cn_cd: 5, cn_other: 2, r_A: 2.615}
  - {pair: CdCl_bridge, cn_cd: 5, cn_other: 3, r_A: 2.797}
  - {pair: CdCl_terminal, cn_cd: 2, cn_other: 1, r_A: 2.307}
  - {pair: CdCl_terminal, cn_cd: 3, cn_other: 1, r_A: 2.325}
  - {pair: CdCl_terminal, cn_cd: 4, cn_other: 1, r_A: 2.34}
  - {pair: CdSe, cn_cd: 2, cn_other: 2, r_A: 2.482}
  - {pair: CdSe, cn_cd: 2, cn_other: 3, r_A: 2.529}
  - {pair: CdSe, cn_cd: 3, cn_other: 2, r_A: 2.506}
  - {pair: CdSe, cn_cd: 3, cn_other: 3, r_A: 2.602}
  - {pair: CdSe, cn_cd: 3, cn_other: 4, r_A: 2.654}
  - {pair: CdSe, cn_cd: 3, cn_other: 5, r_A: 2.776}
  - {pair: CdSe, cn_cd: 4, cn_other: 2, r_A: 2.542}
  - {pair: CdSe, cn_cd: 4, cn_other: 3, r_A: 2.649}
  - {pair: CdSe, cn_cd: 4, cn_other: 4, r_A: 2.717}
  - {pair: CdSe, cn_cd: 4, cn_other: 5, r_A: 2.781}
  - {pair: CdSe, cn_cd: 4, cn_other: 6, r_A: 2.789}
  - {pair: CdSe, cn_cd: 5, cn_other: 3, r_A: 2.675}
  - {pair: CdSe, cn_cd: 5, cn_other: 5, r_A: 2.896}
angles:
  Cd:
    cn2:
      default_deg: 175.603
    cn3:
      by_signature:
        Cl1Se2:
          Se-Se: 140.764
          Cl-Se: 103.785
        Cl2Se1:
          Cl-Se: 103.351
          Cl-Cl: 121.857
          # Role-resolved clean-DFT medians. A shared mu2 bridge connects this
          # Cd to another Cd that is also bonded to this center's Se; a
          # non-shared bridge does not. These are local graph environments and
          # never depend on k or p. p10/p90 record the observed spread but do
          # not create additional hard constraints.
          by_role_signature:
            Cl_t+Cl_t+Se:
              status: insufficient_clean_dft_samples
            Cl_b2s+Cl_t+Se:
              Cl_b2s-Cl_t: {angle_deg: 122.366, p10_deg: 117.197, p90_deg: 132.446}
              Cl_b2s-Se: {angle_deg: 93.910, p10_deg: 89.829, p90_deg: 98.028}
              Cl_t-Se: {angle_deg: 143.621, p10_deg: 135.425, p90_deg: 148.378}
            Cl_b2n+Cl_t+Se:
              Cl_b2n-Cl_t: {angle_deg: 110.125, p10_deg: 102.622, p90_deg: 120.936}
              Cl_b2n-Se: {angle_deg: 103.396, p10_deg: 92.952, p90_deg: 116.898}
              Cl_t-Se: {angle_deg: 143.493, p10_deg: 130.327, p90_deg: 153.617}
            Cl_b2s+Cl_b2s+Se:
              Cl_b2s-Cl_b2s: {angle_deg: 138.068, p10_deg: 133.960, p90_deg: 144.772}
              Cl_b2s-Se: {angle_deg: 101.651, p10_deg: 99.929, p90_deg: 102.909}
            Cl_b2n+Cl_b2s+Se:
              Cl_b2n-Cl_b2s: {angle_deg: 121.443, p10_deg: 114.182, p90_deg: 131.473}
              Cl_b2n-Se: {angle_deg: 137.911, p10_deg: 130.540, p90_deg: 146.405}
              Cl_b2s-Se: {angle_deg: 97.781, p10_deg: 93.350, p90_deg: 98.733}
            Cl_b2n+Cl_b2n+Se:
              Cl_b2n-Cl_b2n: {angle_deg: 102.761, p10_deg: 94.683, p90_deg: 109.418}
              Cl_b2n-Se: {angle_deg: 126.384, p10_deg: 116.129, p90_deg: 139.869}
            Cl_b3+Cl_t+Se:
              Cl_b3-Cl_t: {angle_deg: 111.797, p10_deg: 102.671, p90_deg: 125.469}
              Cl_b3-Se: {angle_deg: 93.432, p10_deg: 88.139, p90_deg: 94.770}
              Cl_t-Se: {angle_deg: 154.098, p10_deg: 139.959, p90_deg: 163.044}
            Cl_b2n+Cl_b3+Se:
              Cl_b2n-Cl_b3: {angle_deg: 90.428, p10_deg: 86.595, p90_deg: 115.141}
              Cl_b2n-Se: {angle_deg: 154.365, p10_deg: 138.395, p90_deg: 163.048}
              Cl_b3-Se: {angle_deg: 104.833, p10_deg: 99.444, p90_deg: 117.343}
        Cl3:
          Cl-Cl: 122.678
        Se3:
          Se-Se: 117.831
    cn4:
      default_deg: 109.5
  Se:
    cn2:
      default_deg: 90.119
    cn3:
      default_deg: 89.245
    cn4:
      default_deg: 97.446
    cn5:
      default_deg: 83.324
  Cl:
    cn2:
      default_deg: 88.143
    cn3:
      default_deg: 85.293
dihedrals:
  improper:
    Cd:
      cn3:
        Cl1Se2: 0.0
        Cl2Se1: 0.0
        Cl3: 0.0
        Se3: 0.0
  proper:
    - path: [Cd, Cl, Cd, Se]
      target_deg: 0.0
      weight: preferred
      tolerance_deg: 30.0
    - path: [Cd, Se, Cd, Cl]
      target_deg: null
      weight: clearance
    - path: [Cd, Se, Cd, Se]
      target_deg: null
      weight: clearance
      exclude_if: endocyclic_ring_edge
  one_four:
    Cl-Se: {soft_min_A: 3.50, hard_min_A: 3.30}
    Cl-Cl: {soft_min_A: 3.40, hard_min_A: 2.80}
    Se-Se: {soft_min_A: 3.90, hard_min_A: 3.80}
    Cd-Cd: {soft_min_A: 3.30, hard_min_A: 3.20}

# ------------------------------------------------------------------ MOTIFS --
# Seed fragments the skeleton enumerator grows from.  Local indices only:
# Cd0.. and Se0.. within the motif; edges are [cd_index, se_index].
# Omit this section to fall back to the built-in ring6 + path/edge fusions.
motifs:
  ring6:                      # Cd3Se3 six-ring: Cd0-Se0-Cd1-Se1-Cd2-Se2-Cd0
    edges: [[0,0],[0,2],[1,0],[1,1],[2,1],[2,2]]

  fusions:                    # two six-rings sharing atoms
    - name: path_Cd1Se2       # share Se0-Cd1-Se1 (3 atoms, 2 bonds)
      edges: [[0,0],[0,2],[1,0],[1,1],[2,1],[2,2],
              [3,0],[3,3],[4,1],[4,3]]
    - name: edge_CdSe         # share Cd0-Se0 (2 atoms, 1 bond)
      edges: [[0,0],[0,2],[0,4],[1,0],[1,1],[2,1],[2,2],
              [3,0],[3,3],[4,3],[4,4]]
    # face-share (4 atoms, 3 bonds) is deliberately absent: measured zero
    # times in bulk zinc-blende (it is a bicyclo[2.2.2] cage needing boats).

# -------------------------------------------------------------- RELAXATION --
# Post-construction GFN-xTB relaxation.  The constructed geometry only
# satisfies the restraint tables; xTB replaces that with a real semi-empirical
# surface and gives every isomer a total energy, which ranks them on physics
# rather than on a bond-count proxy.
relaxation:
  enabled: true
  method: GFN1-xTB
  accuracy: 1.0
  electronic_temperature: 300.0
  max_iterations: 500
  fmax: 0.02                  # eV/A, BFGS convergence
  max_steps: 500
  # Interpreter that has xtb-python installed.  Omit when xtb is importable
  # from the builder's own environment.
  python: ~/miniconda3/envs/xtb/bin/python
  # Relaxation may move atoms far enough to make or break a bond; a structure
  # whose bonding drifts is no longer the isomer that was enumerated, so it is
  # counted and reported (Wiberg bond order above the threshold = bonded).
  check_connectivity: true
  bond_order_threshold: 0.5
