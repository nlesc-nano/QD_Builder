# Compact motif run pack; the detailed bridge-first geometry is imported below.
cif: CdSe_zb.cif
charges: {Cd: 2, Se: -2, Cl: -1}
nucleation:
  kmax: 3
  mode: exact
  core_monomer: {cation: Cd, anion: Se}
  precursor: {center: Cd, ligand: Cl, ligand_count: 2}
  site_tolerance: 0.2
schema_version: 2
name: cdse_cdcl2_motif_xtb
geometry_reference: cdse_cdcl2_bridge_first_xtb.yaml
graph_rules:
  require_inorganic_connected: true
  enforce_min_cn: true
  coordination:
    Cd: {min: 2, max: 4}
    Se: {min: 2, max: 4}
    Cl: {min: 1, max: 3}
  pair_rules: {Cd-Se: {bond: allowed, bond_max_distance: 3.25}, Cd-Cl: {bond: allowed, bond_max_distance: 2.90}, Cd-Cd: {bond: forbidden, min_distance: 3.00}, Se-Se: {bond: forbidden, min_distance: 3.80}, Cl-Se: {bond: forbidden, min_distance: 2.70}, Cl-Cl: {bond: forbidden, min_distance: 2.70}}
  allowed_neighbor_signatures:
    Cl: [Cd1, Cd2, Cd3]
  min_ring_size: {Cd-Se: 6}
  decoration_mode: motif_bridge_first
  bridge_first_hard_max_bridges_per_cd: 2
  bridge_first_prefer_bridges_per_cd: 3
  max_shared_ligands_per_host_pair: 1
  min_bridged_host_cn: 3
  forbid_mono_se_dual_terminal: true
  forbid_mu3_host_bridge_overlap: true
motifs:
  Se-Cd2:
    center: Se
    linker: Cd
    linker_count: 2
    bond_A_by_linker_cn: {2: 2.5, 3: 2.5, 4: 2.54}
    bond_tol_A: 0.08
    angle_deg: 90.0
    angle_tol_deg: 12.0
  Se-Cd3:
    center: Se
    linker: Cd
    linker_count: 3
    bond_A_by_linker_cn: {2: 2.5, 3: 2.6, 4: 2.65}
    bond_tol_A: 0.08
    angle_deg: 90.0
    angle_tol_deg: 12.0
    improper_deg: 82.0
    improper_tol_deg: 12.0
  Se-Cd4:
    center: Se
    linker: Cd
    linker_count: 4
    bond_A_by_linker_cn: {3: 2.65, 4: 2.72}
    bond_tol_A: 0.08
    angle_deg: 109.5
    angle_tol_deg: 12.0
  Cl-Cd1:
    center: Cl
    linker: Cd
    linker_count: 1
    bond_A_by_linker_cn: {2: 2.32, 3: 2.32, 4: 2.32}
    bond_tol_A: 0.05
  Cl-Cd2:
    center: Cl
    linker: Cd
    linker_count: 2
    bond_A_by_linker_cn: {3: 2.54, 4: 2.54}
    bond_tol_A: 0.08
    angle_deg: 90.0
    angle_tol_deg: 12.0
  Cl-Cd3:
    center: Cl
    linker: Cd
    linker_count: 3
    bond_A_by_linker_cn: {3: 2.7, 4: 2.7}
    bond_tol_A: 0.08
    angle_deg: 88.0
    angle_tol_deg: 15.0
junctions:
  coplanar_shared_pair:
    - {when: {anion: Se, anion_cn: 2, ligand: Cl, ligand_cn: 2}, tol_deg: 6.0, weight: 2.0}
reconstruction: {method: motif_factor, audit: clashes_only, factor_starts_per_graph: 1, max_nfev: 8, layout_iterations: 40, xtb_starts_per_graph: 1, overlap_min_A: 0.75, start_max_bond_error_A: 0.5}
relaxation: {enabled: true, method: GFN1-xTB, accuracy: 1.0, electronic_temperature: 300.0, max_iterations: 500, fmax: 0.05, max_steps: 100, timeout_s: 90, python: ~/miniconda3/envs/xtb/bin/python, check_connectivity: true}
