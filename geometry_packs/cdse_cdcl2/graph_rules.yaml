# Graph stage: which (k,p) graphs exist at all.
#
# Nothing in this file knows about coordinates.  It decides what a legal
# CdSe/CdCl2 connectivity is, how decorations are enumerated, and which of
# them are handed to the 3D embedder.
#
# An unknown key here is an error, not a silent default -- see
# NUCLEATION_GRAPH_RULE_KEYS in geometry_pack.py for the full vocabulary.

graph_rules:

  # ---- what counts as a legal graph ------------------------------------
  coordination:
    Cd: {min: 2, max: 4}
    Se: {min: 2, max: 4}
    Cl: {min: 1, max: 3}

  # `bond_max_distance` is the bond-formation cutoff; `min_distance` is a
  # construction epsilon for the embedder, NOT an audit threshold for a
  # relaxed structure (79% of embedded structures sit below the Cd-Cd value).
  # Audit thresholds live in INSTALL.md.
  pair_rules:
    Cd-Se: {bond: allowed,   bond_max_distance: 3.25}
    Cd-Cl: {bond: allowed,   bond_max_distance: 2.90}
    Cd-Cd: {bond: forbidden, min_distance: 3.00}
    Se-Se: {bond: forbidden, min_distance: 3.80}
    Cl-Se: {bond: forbidden, min_distance: 2.70}
    Cl-Cl: {bond: forbidden, min_distance: 2.70}

  allowed_neighbor_signatures:
    Cl: [Cd1, Cd2, Cd3]        # terminal, mu2 bridge, mu3 cap

  min_ring_size: {Cd-Se: 6}    # no Cd2Se2 4-rings in the seed
  require_inorganic_connected: true
  enforce_min_cn: true

  min_bridged_host_cn: 3                # a bridge needs hosts of CN >= 3
  max_shared_ligands_per_host_pair: 1   # one Cl per Cd-Cd pair
  forbid_mono_se_dual_terminal: true
  forbid_mu3_host_bridge_overlap: true

  # ---- how decorations are generated -----------------------------------
  # k<=2: motif_bridge_first, which also explores terminal-heavy decorations
  # that the bridge-target generator never emits.  The whole k<=2 range is 121
  # graphs, so it is exhaustive and the caps below barely bind.
  # k>=3: motif_bridge_target, which picks the bridge set first and reaches
  # exactly 2p bridges -- the count the bin optimum tracks
  # (n_bridges = 0.964*(2p) - 0.36, r=0.993 over 29 g-xTB bins).
  decoration_mode: motif_bridge_first
  decoration_mode_from_k: 3
  decoration_mode_at_or_above: motif_bridge_target

  # Must be <= the hard cap or it never fires: the hard check runs first and
  # unconditionally.  Read only by motif_bridge_first, so this is a k<=2 knob.
  bridge_first_prefer_bridges_per_cd: 2
  # 3, not 2: the measured optimum needs 2.0-2.6 bridges per Cd, and a cap of
  # 2 limits total bridges to n_Cd -- which makes the best known structure
  # unconstructible in every bin with p >~ k+1.  4 changes nothing further.
  bridge_first_hard_max_bridges_per_cd: 3

  # |Aut| cap for the motif_bridge_first beam, which canonicalises every state
  # at O(|Aut|.n log n).  Does not bind at k<=2; kept because that mode is
  # still selectable.  The bridge-target generator prunes orbits instead and
  # uses its own cap (bridge_target_max_automorphisms, default 4096) -- at 64
  # it silently falls back to no pruning and over-emits 72x at k2p5.
  bridge_first_max_automorphisms: 64

  # Emit only the 2p shell.  Window 1 would add 2p-1 (44% of bin best-deciles
  # against 15% for 2p) but the reservoir samples shells in proportion to
  # their size, and 2p-1 is ~8x larger at k3p4 -- so it would crowd out the
  # small, rich 2p shell.  Revisit if the budget is made shell-stratified.
  bridge_target_count_window: 0

  # ---- which graphs reach 3D -------------------------------------------
  # Spend the budget across skeletons, not deeply on a few: best-per-skeleton
  # spans 0.7-2.9 eV in a bin while decorations of one skeleton at 2p span
  # 0.3-0.5 eV.  Reservoir-sampled over each skeleton's full enumeration, so
  # the hungriest-host-first emission order does not bias the sample.
  # Measured best-of-N within a skeleton: N=8 is 0.048 eV off that skeleton's
  # best, N=20 is 0.003 eV.  Candidates map 1:1 to accepted structures
  # (measured k3p2 and k2p3), so this is also the g-xTB job size.
  #   k=3: 37 skeletons -> <=740 runs;  k=4: 261 -> <=5220
  selection_max_per_skeleton: 20
  selection_per_skeleton_from_k: 3

  # selection_order / selection_max_wiener_excess are deliberately absent.
  # The compactness cut removed 3 graphs of 121 at k<=2 and kept 93% at k3p4;
  # the per-skeleton budget supersedes it.
