# Default / legacy growth.yaml (backward compatible).
# Prefer a named envelope:
#   growth_survey.yaml   — new system, few hundred structures
#   growth_k2k3.yaml     — production k=2,3
#   growth_k4k8.yaml     — production k=4–8 (surface law + local attach)
#   growth_k9k13.yaml    — production k=9–13 (lean, A off at 12–13)
#
# Default / legacy file.  Named envelopes live beside this one:
#   growth_survey.yaml, growth_k2k3.yaml, growth_k4k8.yaml, growth_k9k13.yaml
#
# Molecular package growth + thermodynamic reporting.
#
# This file is for the growth path only.  It does not change which graphs
# the map enumerates.  Grand-potential / chemical-potential tables are
# INFORMATIONAL: they re-rank stored energies for lean vs rich precursor
# regimes and never prune parents, packages, or decorations.
#
# Graph legality: graph_rules.yaml
# Motif vocabulary: motifs.yaml
# Metric embed tables: embed.yaml
# Full opt driver: run_gxtb.yaml

schema_version: 1
name: cdse_cdcl2_growth

# Building blocks (mirror lattice nucleation.monomer_p_values).
# Each growth step adds CdSe + p_m CdCl2 after shedding s packages:
#   p_child = p_parent - s + p_m
monomer_p_values: [1, 2, 3]

# Free-molecule references (same Hamiltonian as the map: g-xTB / xtb path used
# for the map).  Paths point at finished opt jobs; energies are pinned so a run
# is reproducible without re-reading floating logs.
#
# Regenerated 2026-08-10 from:
#   .../Nucleation/graphs/xtb/cdse  (2 atoms)
#   .../Nucleation/graphs/xtb/cdcl2 (3 atoms Cl-Cd-Cl; earlier file was broken)
references:
  method: g-xTB
  # Local opt jobs (optional; energies below are authoritative for reporting)
  cdse_dir: /Users/ivaninfante/Documents/University/Programs/Nucleation/graphs/xtb/cdse
  cdcl2_dir: /Users/ivaninfante/Documents/University/Programs/Nucleation/graphs/xtb/cdcl2
  # Hartree (xtbopt.xyz comment energy:), 2026-08-10 re-opt
  # CdCl2 is 3-atom Cl–Cd–Cl (previous file was malformed diatomic).
  energy_cdse_hartree: -2569.111491084828
  energy_cdcl2_hartree: -1088.171326501977
  # eV = Ha * 27.211386245988 (match index.csv xtb_energy_eV columns)
  energy_cdse_eV: -69909.0850929154
  energy_cdcl2_eV: -29610.6502672544
  # Min total energies E(1, p_m) from gxtb target k1 bins (eV) — for dE_pkg
  # ΔE_pkg(k,p; p_m) = E(k,p) − k·E(1,p_m) − (p − k·p_m)·E(CdCl2)
  package_cluster_eV:
    1: -99522.586496
    2: -129134.745316
    3: -158746.985871

# Parent selection from a finished map (relaxed cores)
parents:
  energy_window_eV: 1.0
  rank_by: energy              # energy | formation (formation = report aid only for ranking choice)
  max_skeletons_frac: 0.30
  max_skeletons_cap: 25
  decorations_per_skeleton: 2
  core_source: relaxed         # distance graph from opt coords
  bond_cutoffs: from_graph_rules

# Shedding complete CdCl2 packages (kinetic + chemical)
# Move B (coord) uses WBO/distance rank; move A (graph) still enumerates
# combinatorial precursor-Cd subsets for core diversity.
shed:
  mode: wbo                    # wbo | enumerate
  max_shed: 2
  prefer_low_shed: true        # early k: shed often before continuous s=0
  wbo_source: parent_opt       # least-bound precursor Cd + its two Cl first

# Growth geometry — move B (coordinate carry-over)
# start_from: relaxed_coords enables B; graph_only disables B (A only).
geometry:
  start_from: relaxed_coords
  place_monomer: embed_tables
  clash_policy: soft
  local_cleanup:
    enabled: true
    method: g-xTB              # short clean-up only when charge-neutral
    max_cycles: 20
  require_charge_neutral_for_cleanup: true

child:
  redecorate: true             # move A: redecorate graph cores
  redecorate_slack: false      # A only for p≤p_surf; slack bin is B-only
  full_opt: g-xTB              # full opt for both moves
  full_opt_cycles: 150         # A+B geo-opt maxcycle; cleanup stays 20

# Soft ranking after the energy window: score = E + penalty (eV).
# Does not force zb, a sphere, or a Wulff count.  Energy window still
# uses raw E; these terms only re-rank inside that window.
soft_rules:
  enabled: true
  diamond:                     # Cd–Se–Cd–Se 4-rings only (not Cd–Se–Cd–Cl)
    enabled: true
    weight_eV: 0.15            # per isolated diamond
    fused_weight_eV: 0.30      # extra per 4-ring that shares an edge (ladder)
    from_k: 2
  f6:                          # 6-ring fusion quality
    enabled: true
    weight_eV: -0.04           # reward share = 2 or 3 (chair / adamantane)
    dirty_weight_eV: 0.20      # penalize share ≥ 4 (diamond in the 6-ring mesh)
    from_k: 3
  terminal_se3cl:              # Se3 + dangling Cl (μ1).  Bridging Se3Cl is kept.
    enabled: true
    weight_eV: 0.20
    from_k: 4
  se1cl3:                      # precursor-like CdCl3 on one Se
    enabled: true
    weight_eV: 0.05
    from_k: 6
  asphericity:                 # off: rods / platelets stay allowed
    enabled: false
    weight_eV: 1.0
    only_if_dirty_f6: true     # if turned on, only punish sausages
    from_k: 6

# Report-only condition scan (does NOT steer growth)
chemical_potential:
  enabled: true
  # g-xTB grand potential (same algebra as nucleation GP reconstruction):
  #   Ω = E − k μ_CdSe⁰ − p (E(CdCl2) + Δμ)
  # free:    μ_CdSe⁰ = E(CdSe)
  # ligated: μ_CdSe⁰(p_m) = E(1,p_m) − p_m E(CdCl2)  from package_cluster_eV
  # Log shows lean / 0 / rich subset; full grid is available for CSV/index.
  delta_mu_cdcl2_eV: [-1.0, -0.5, 0.0, 0.5, 1.0]
