# BRANCH of growth.yaml -- do not use for production comparisons.
#
# Target-agnostic lineage preservation:
# 1. parents.compact_rank_below_k: 5
#    Ranks parents by compact ZB shape (6-rings, CN>=3 branching, small Rg)
#    below k=5, and deduplicates on occupation_anion_skeleton_key.
# 2. parents.reserved_compact_seats: 3
#    Reserves parent slots strictly for the most compact distinct anion backbones.
# 3. parents.cross_p_retention: true
#    Rescues distinct anion backbones stabilized at high p (passivation regime)
#    into lean bins where they were also generated as in-path candidates.
# 4. Widened cap at low k (k=1..4: cap 12 instead of 8) to admit carriers at p=3, 4.
#
# growth.yaml is frozen; this file exists to test target-agnostic emergence
# and must write to its own --output.
#
# Readout:  PYTHONPATH=src python scripts/check_wulff_ancestry.py <output_dir>

schema_version: 1
name: cdse_growth_zb_agnostic_k5

monomer_p_values: [1, 2, 3]

references:
  method: g-xTB
  energy_cdse_hartree: -2569.111491084828
  energy_cdcl2_hartree: -1088.171326501977
  energy_cdse_eV: -69909.0850929154
  energy_cdcl2_eV: -29610.6502672544
  package_cluster_eV:
    1: -99522.586496
    2: -129134.745316
    3: -158746.985871

surface:
  beta: 2.7
  alpha: 1.0
  p_slack: 1
  max_p_child: 0

parents:
  energy_window_eV: 0.80
  rank_by: energy
  compact_rank_below_k: 5
  reserved_compact_seats: 3
  cross_p_retention: true
  max_skeletons_frac: 1.0
  max_skeletons_cap: 12
  decorations_per_skeleton: 2
  min_p: 1
  core_source: relaxed
  bond_cutoffs: from_graph_rules

shed:
  mode: distance
  max_shed: 2
  prefer_low_shed: true
  persist_wbo: true

attach: local

geometry:
  start_from: relaxed_coords
  place_monomer: embed_tables
  clash_policy: soft
  local_cleanup:
    enabled: true
    method: g-xTB
    max_cycles: 25
    freeze_core: true
    opt_level: crude
  require_charge_neutral_for_cleanup: true

child:
  redecorate: true
  redecorate_slack: false
  full_opt: g-xTB
  full_opt_cycles: 150

moves:
  graph: false
  coord: false
  zb_sites: true

max_children_per_channel: 20
zb_max_shells_per_bin: 400
zb_motif_log: true
zb_channel_b: true
zb_shell_budget_decay: 0.0
zb_min_shells_per_bin: 0
zb_shell_budget_ceiling: 0

basin_hop:
  enabled: false
  min_k: 3
  max_seeds_per_bin: 8
  steps: 50
  moves: [shake, single_atom]
  amplitude_A: 0.45
  temperature_eV: 0.15
  seed_by: minimum
  workers: 1

lattice_switch:
  enabled: false

soft_rules:
  enabled: false

endpoint_diagnostic:
  enabled: true
  k: 13
  reference: k13_wulff_core.yaml
  site_match_tolerance_A: 0.35

minimum_consolidation:
  enabled: true
  energy_tolerance_eV: 0.01
  pair_distance_rms_A: 0.05
  core_rmsd_A: 0.10
  full_rmsd_A: 0.15
  max_displacement_A: 0.25
  wbo_rms_tolerance: 0.15
  require_wbo_when_available: false
  allow_reflection: false
  max_graph_mappings: 256
  max_minima_per_occupation: 2
  max_occupations_per_minimum: 0

by_k:
  - k_min: 1
    k_max: 1
    monomer_p_values: [1, 2, 3]
    max_shed: 2
    energy_window_eV: 1.00
    max_skeletons_cap: 12
    reserved_compact_seats: 0
    cross_p_retention: true
    decorations_per_skeleton: 1
    min_p: 1
    redecorate: true
    moves: {graph: false, coord: false, zb_sites: true}
    max_children_per_channel: 20
    p_slack: 1
  - k_min: 2
    k_max: 2
    monomer_p_values: [1, 2]
    max_shed: 2
    energy_window_eV: 0.80
    max_skeletons_cap: 12
    reserved_compact_seats: 3
    cross_p_retention: true
    decorations_per_skeleton: 1
    min_p: 1
    redecorate: true
    moves: {graph: false, coord: false, zb_sites: true}
    max_children_per_channel: 16
    p_slack: 1
  - k_min: 3
    k_max: 3
    monomer_p_values: [1, 2]
    max_shed: 2
    energy_window_eV: 0.60
    max_skeletons_cap: 12
    reserved_compact_seats: 3
    cross_p_retention: true
    decorations_per_skeleton: 2
    min_p: 2
    redecorate: true
    moves: {graph: false, coord: false, zb_sites: true}
    max_children_per_channel: 16
    p_slack: 1
  - k_min: 4
    k_max: 4
    monomer_p_values: [1, 2]
    max_shed: 2
    energy_window_eV: 0.60
    max_skeletons_cap: 12
    reserved_compact_seats: 3
    cross_p_retention: true
    decorations_per_skeleton: 2
    min_p: 2
    redecorate: true
    moves: {graph: false, coord: false, zb_sites: true}
    max_children_per_channel: 16
    p_slack: 1
  - k_min: 5
    k_max: 12
    monomer_p_values: [1, 2]
    max_shed: 2
    energy_window_eV: 0.60
    max_skeletons_cap: 8
    reserved_compact_seats: 2
    cross_p_retention: true
    decorations_per_skeleton: 2
    min_p: 2
    redecorate: true
    moves: {graph: false, coord: false, zb_sites: true}
    max_children_per_channel: 16
    p_slack: 1

chemical_potential:
  enabled: true
  delta_mu_cdcl2_eV: [-1.0, -0.5, 0.0, 0.5, 1.0]
