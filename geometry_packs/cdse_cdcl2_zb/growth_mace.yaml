# MACE-MH-1 growth from k=1 (restart of the ZB lineage search on the PBE-like
# surface).  Derived from growth_agnostic_k5.yaml; differences:
#   * child.full_opt / local_cleanup use MACE-MH-1 (persistent MPS worker,
#     500 BFGS steps -- unconverged endpoints are rejected, never accepted);
#   * references are MACE-MH-1 monomer energies (CdSe diatomic 2.419 A,
#     CdCl2 linear 2.282 A, fmax 0.005) -- package_cluster_eV is left empty and
#     is filled by the k=1 bins of this run;
#   * parents.family_mode: se_skeleton -- lineage on the anion lattice
#     skeleton, p-agnostic (docs/nucleation/mace_descriptors.md, plan 2026-09-16);
#   * energy windows are PROVISIONAL (0.8 eV) until re-measured on MACE bins.
# Relaxation settings, two-tier descriptors and embed table come from
# run_mace_mh1.yaml (relaxation.descriptor_cutoffs: two_tier, embed_mace.yaml).
#
# Not a branch of the frozen growth.yaml archive; write to its own --output.

schema_version: 1
name: cdse_growth_zb_mace_mh1

monomer_p_values: [1, 2, 3]

references:
  method: MACE-MH-1
  # MACE-MH-1 (omat_pbe, float32, MPS) relaxed monomers, fmax 0.005 eV/A,
  # 2026-09-16.  CdSe: r = 2.419 A.  CdCl2: linear, r = 2.282 A.
  energy_cdse_eV: -2.240818500518799
  energy_cdcl2_eV: -6.730026721954346
  package_cluster_eV: {}

surface:
  beta: 2.7
  alpha: 1.0
  p_slack: 1
  max_p_child: 0

parents:
  energy_window_eV: 0.80          # PROVISIONAL: re-measure on MACE bins
  rank_by: energy
  compact_rank_below_k: 5
  reserved_compact_seats: 3
  cross_p_retention: true
  # Se-skeleton lineage (p-agnostic families); see _select_se_skeleton_family_parents
  family_mode: se_skeleton
  families_cap: 12
  p_states_per_family: 3
  realizations_per_family: 2
  min_parents_per_p: 1
  max_skeletons_frac: 1.0
  max_skeletons_cap: 12
  decorations_per_skeleton: 2
  min_p: 1
  core_source: relaxed
  bond_cutoffs: from_graph_rules

shed:
  mode: distance
  max_shed: 2
  prefer_low_shed: true
  persist_wbo: true

attach: local

geometry:
  start_from: relaxed_coords
  place_monomer: embed_tables
  clash_policy: soft
  local_cleanup:
    enabled: true
    method: MACE-MH-1
    max_cycles: 50
    freeze_core: true
    opt_level: crude
  require_charge_neutral_for_cleanup: true

child:
  redecorate: true
  redecorate_slack: false
  full_opt: MACE-MH-1
  full_opt_cycles: 500

moves:
  graph: false
  coord: false
  zb_sites: true

max_children_per_channel: 20
zb_max_shells_per_bin: 400
zb_motif_log: true
zb_channel_b: true
zb_shell_budget_decay: 0.0
zb_min_shells_per_bin: 0
zb_shell_budget_ceiling: 0

basin_hop:
  enabled: false
  min_k: 3
  max_seeds_per_bin: 8
  steps: 50
  moves: [shake, single_atom]
  amplitude_A: 0.45
  temperature_eV: 0.15
  seed_by: minimum
  workers: 1

lattice_switch:
  enabled: false

soft_rules:
  enabled: false

endpoint_diagnostic:
  enabled: true
  k: 13
  reference: k13_wulff_core.yaml
  site_match_tolerance_A: 0.35

minimum_consolidation:
  enabled: true
  energy_tolerance_eV: 0.01
  # MACE: same bonding graph + energies within 10 meV = one basin, whatever
  # the geometry (floppy same-graph conformers; measured on k=3: 10 in-path
  # endpoints at p=1 are 2 graphs, 89 at p=3 are 36).  Geometric criteria
  # below still decide pairs outside this window.
  graph_energy_merge_eV: 0.010
  pair_distance_rms_A: 0.05
  core_rmsd_A: 0.10
  full_rmsd_A: 0.15
  max_displacement_A: 0.25
  wbo_rms_tolerance: 0.15
  require_wbo_when_available: false
  allow_reflection: false
  max_graph_mappings: 256
  max_minima_per_occupation: 2
  max_occupations_per_minimum: 0

by_k:
  - k_min: 1
    k_max: 1
    monomer_p_values: [1, 2, 3]
    max_shed: 2
    energy_window_eV: 0.80
    max_skeletons_cap: 12
    reserved_compact_seats: 0
    cross_p_retention: true
    decorations_per_skeleton: 1
    min_p: 1
    redecorate: true
    moves: {graph: false, coord: false, zb_sites: true}
    max_children_per_channel: 20
    p_slack: 1
  - k_min: 2
    k_max: 2
    monomer_p_values: [1, 2]
    max_shed: 2
    energy_window_eV: 0.80
    max_skeletons_cap: 12
    reserved_compact_seats: 3
    cross_p_retention: true
    decorations_per_skeleton: 1
    min_p: 1
    redecorate: true
    moves: {graph: false, coord: false, zb_sites: true}
    max_children_per_channel: 16
    p_slack: 1
  - k_min: 3
    k_max: 3
    monomer_p_values: [1, 2]
    max_shed: 2
    energy_window_eV: 0.80
    max_skeletons_cap: 12
    reserved_compact_seats: 3
    cross_p_retention: true
    decorations_per_skeleton: 2
    min_p: 2
    redecorate: true
    moves: {graph: false, coord: false, zb_sites: true}
    max_children_per_channel: 16
    p_slack: 1
  - k_min: 4
    k_max: 4
    monomer_p_values: [1, 2]
    max_shed: 2
    energy_window_eV: 0.80
    max_skeletons_cap: 12
    reserved_compact_seats: 3
    cross_p_retention: true
    decorations_per_skeleton: 2
    min_p: 2
    redecorate: true
    moves: {graph: false, coord: false, zb_sites: true}
    max_children_per_channel: 16
    p_slack: 1
  - k_min: 5
    k_max: 12
    monomer_p_values: [1, 2]
    max_shed: 2
    energy_window_eV: 0.80
    max_skeletons_cap: 8
    reserved_compact_seats: 2
    cross_p_retention: true
    decorations_per_skeleton: 2
    min_p: 2
    redecorate: true
    moves: {graph: false, coord: false, zb_sites: true}
    max_children_per_channel: 16
    p_slack: 1

chemical_potential:
  enabled: true
  delta_mu_cdcl2_eV: [-1.0, -0.5, 0.0, 0.5, 1.0]
