version: 3
chemistry_adapter: cdse_cdcl2
seed: 881127
workers: 24
max_calls: 1600
launch_hours: 46
timeout_s: 1800
max_steps: 150
checkpoint_interval_batches: 10
progress_interval_batches: 1

# Targeted high-chloride validation.  The strict Phase-C archive is the
# source; only the k=8, p=11 audit frontier is revisited.  No lower-p or
# larger-k structures can enter this branch.
enabled_phases: [C]
phase_a_k: [5, 6]
phase_b_k: 7
phase_c_k: 8
phase_cycle_start: {C: 0}
min_cycles: 2
max_cycles: 4

p_max: {1: 3, 2: 5, 3: 6, 4: 7, 5: 8, 6: 9, 7: 10, 8: 11}
parent_p_by_k:
  8: [11]
parent_roles_by_k:
  8: [audit]
proposal_p_by_k:
  8: [11]

# Fixed-k only: test the relaxed high-p basin with balanced local moves.
operation_calls:
  8: {fixed: 1500}
operation_calls_by_p:
  8:
    fixed: {11: 1500}

family_slots: {8: 60}
cohort_min_families_by_p:
  8: {11: 3}
required_primary_families_by_p: {}

admission_fraction: 0.0
source_novelty_fraction: 0.0
subfamilies_per_family: 4
p_states_per_family: 4
geometries_per_family: 2
minimum_launched_cycles: 2

primary_slots: 12
audit_slots: 2
audit_fraction: 1.0
bridge_prior: 0.80
proposals_per_move: 8
proposals_per_parent: 32
fixed_rounds: 0

chemistry_options:
  classification_mode: high_p_mu3_overlap_relaxed
  # This is the only softened rule.  All other graph, CN, connectivity and
  # artifact checks remain active.  Results are kept in a separate output and
  # the protocol records this override explicitly.
  graph_rule_overrides:
    forbid_mu3_host_bridge_overlap: false
  fixed_channel_counts: {repair: 3, exchange: 3, topology: 2}

convergence_patience: 2
new_families_per_100_calls: 2.0
convergence_energy_window_eV: 1.0
energy_improvement_eV: 0.05
minimum_endpoint_fraction: 0.25
proposals_per_family_fixed: 8
proposals_per_family_growth: 6
