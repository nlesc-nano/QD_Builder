angle_sum_cn3:
  Cd: {target_deg: 360, tol_deg: 8}
  Se: {target_deg: 270, tol_deg: 15}
  Cl: {target_deg: 270, tol_deg: 20}
dihedrals:
  improper:
    Cd:
      cn3:
        default: {deg: 0.0, tol_deg: 12}
    Se:
      cn3:
        Cd3: {deg: 82.0, tol_deg: 12}
  proper:
  - path: [Cd, Cl_b, Cd, Se]
    when: {se_cn_min: 3}
    phi_deg: 0
    tol_deg: 25
  - path: [Cd, Cl_b, Cd, Se]
    when: {se_cn_max: 2}
    phi_deg: 180
    tol_deg: 30
  - path: [Cd, Cl_b, Cd, Cl_t]
    phi_deg: 180
    tol_deg: 25
nonbonded_1_4:
