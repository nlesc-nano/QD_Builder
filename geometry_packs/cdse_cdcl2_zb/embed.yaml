  Cl-Se: {min_A: 3.3, tol_A: 0.1}
  Cl-Cl: {min_A: 2.8, tol_A: 0.1}
rings:
  cdse_6:
    conformations: [chair]
    derive_from:
      bond: {pair: CdSe, by_cn: true}
      angle_at_cd: {element: Cd, by_cn_and_role_signature: true}
      angle_at_se: {element: Se, by_cn: true}
    dihedrals:
      chair:
        mode: derive_from_angles
        phi_deg: [55, -55, 55, -55, 55, -55]
        tol_deg: [15, 15, 15, 15, 15, 15]
reconstruction: {method: motif_factor, audit: clashes_only, factor_starts_per_graph: 1, max_nfev: 8, layout_iterations: 40,
  xtb_starts_per_graph: 1, overlap_min_A: 0.75, start_max_bond_error_A: 0.5}
