# Metric tables for zb occupation growth.
# Move Z places Cl on a *fixed* zb Cd–Se core using these Cd–Cl lengths.
# `reconstruction.method: motif_factor` is unused on this path (cores are
# CIF coordinates, not rebuilt).  Artifact floors live in run_gxtb.yaml.
#
# 3D embedding: the executable geometry the motif reconstruction targets.
#
# Every number is a g-xTB median over the k1-k5 dataset (644k bonds,
# 711k angles).  Nothing in this file affects which graphs are built --
# it only decides whether a graph can be turned into coordinates.
# Auto-extracted from cdse_cdcl2_bridge_first_gxtb.yaml -- do not hand-edit
# numbers here without re-deriving them from the g-xTB dataset.

