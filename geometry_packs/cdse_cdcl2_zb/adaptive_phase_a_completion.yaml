version: 3
chemistry_adapter: cdse_cdcl2
seed: 161803
workers: 24
max_calls: 3300
launch_hours: 46
timeout_s: 1800
max_steps: 150
checkpoint_interval_batches: 20

# Final bounded Phase-A completion.  The source must be the completed
# nucleation_phase_a_continuation_v1 archive.  Its exact k=5/k=6 cohorts are
# frozen, and representative selection resumes at cycle 5 rather than
# repeating cycles 0--4.
enabled_phases: [A]
phase_a_k: [5, 6]
phase_b_k: 7
phase_c_k: 8
import_source_cohorts: true
phase_cycle_start: {A: 5}
operation_calls:
  5: {fixed: 900}
  6: {growth: 1000, fixed: 1400}
family_slots: {5: 120, 6: 150}
p_max: {1: 3, 2: 5, 3: 6, 4: 7, 5: 8, 6: 9, 7: 10, 8: 11}

# No cohort admission in this completion: discoveries are archived, but they
# do not displace or enlarge the lineage set being systematically completed.
admission_fraction: 0.0
subfamilies_per_family: 2
p_states_per_family: 3
geometries_per_family: 2
minimum_launched_cycles: 2

# Cycles are global representative indices; range(5, 8) executes 5, 6 and 7.
min_cycles: 2
max_cycles: 8
convergence_patience: 2
new_families_per_100_calls: 2.0
energy_improvement_eV: 0.05
minimum_endpoint_fraction: 0.25
proposals_per_family_fixed: 4
proposals_per_family_growth: 6

primary_slots: 12
audit_slots: 2
audit_fraction: 0.10
bridge_prior: 0.80
proposals_per_move: 8
proposals_per_parent: 32
fixed_rounds: 0
