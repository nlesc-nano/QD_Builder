# Zinc-blende occupation growth — legal connectivity + 2p Cl decorate.
#
# Cores (Cd–Se) come from CdSe_zb.cif tet sites, not from a free-graph
# enumerator.  Cl decoration and 3D placement use the *same* pack path
# as the molecular map: motif_bridge_* then embed.yaml (bonds/angles).
# This file does NOT score or rank Cd2Se2 4-rings.

graph_rules:

  coordination:
    Cd: {min: 2, max: 4}
    Se: {min: 2, max: 4}
    Cl: {min: 1, max: 3}

  pair_rules:
    Cd-Se: {bond: allowed,   bond_max_distance: 3.25}
    Cd-Cl: {bond: allowed,   bond_max_distance: 2.90}
    Cd-Cd: {bond: forbidden, min_distance: 3.00}
    Se-Se: {bond: forbidden, min_distance: 3.80}
    Cl-Se: {bond: forbidden, min_distance: 2.70}
    Cl-Cl: {bond: forbidden, min_distance: 2.70}

  allowed_neighbor_signatures:
    Cl: [Cd1, Cd2, Cd3]

  require_inorganic_connected: true
  enforce_min_cn: true

  # Rhombus / 2p Cl chemistry (not a diamond score).
  min_bridged_host_cn: 3
  max_shared_ligands_per_host_pair: 1
  # Cap on mu2 Cl whose *two* hosts both finish at Cd CN 4.  DISABLED.
  #
  # The 74%-carry / 3.0%-vs-13.5% signal this was built on is a between-bin
  # artefact.  The minimum count a bin can even reach rises with Cl/Cd -- 0 up
  # to Cl/Cd 1.0, then 2 at k3p4, 6 at k3p5, 2 at k4p4, 4 at k4p5, 8 at k4p6 --
  # so a cap of 1 leaves those bins with no satisfiable shell and they emit
  # nothing.  Stratified *within* each bin the correlation also reverses: the
  # propagation-eligible structures carry a higher mean count than the bin
  # average in 12 of 14 bins.  On the complete k1-k4 run at budget 250 the cap
  # saves 14% of relaxations and costs 9 of 82 within-bin minima.
  #
  # Kept as a knob (-1 = off) rather than removed: it may still be the right
  # rule expressed as an excess over the bin's achievable minimum.
  max_saturated_host_bridges: -1
  forbid_mono_se_dual_terminal: true
  forbid_mu3_host_bridge_overlap: true

  # Cl decorate (2p).  Not a core enumerator.
  decoration_mode: motif_bridge_first
  decoration_mode_from_k: 3
  decoration_mode_at_or_above: motif_bridge_target
  bridge_first_hard_max_bridges_per_cd: 3
  selection_max_per_skeleton: 3
  selection_per_skeleton_from_k: 1
  # Emit three productive bridge counts, not just the ceiling.  With the
  # default 0 the walk returned after the maximum-bridge tier, so 98.0% of
  # built Cl were mu2 and 90% of all relaxations went to all-bridge shells --
  # which yield 3.7% propagation-eligible endpoints, against 25.6% for shells
  # carrying one terminal Cl.  Measured on the k3p3/k4p3 occupations of the
  # k1-k4 run: 0 of 1029 selected shells carried a terminal Cl before, 690 of
  # 1029 after.
  bridge_target_count_window: 2
  # Emission and node caps are counted *per productive bridge count*, so this
  # is 3 x 40 = 120 graphs per core here.  40 and 120 per window select the
  # same terminal-Cl coverage (only which representative of a family is kept
  # changes), and 40 is 3x cheaper: 63 vs 149 ms per occupation at k3p3.
  bridge_target_max_emissions_per_skeleton: 40
  bridge_target_max_nodes_per_skeleton: 2000
