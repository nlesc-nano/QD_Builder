# CdSe/CdCl2 zinc-blende growth driver using MACE-MH-1 for relaxation.
# This is deliberately separate from run_gxtb.yaml: archives produced by the
# two potentials have different energy scales and must not be merged/ranked.

schema_version: 2
name: cdse_cdcl2_zb_mace_mh1

include:
  - graph_rules.yaml
  - decoration_policy_mace.yaml
  - motifs.yaml
  - embed_mace.yaml   # mined from MACE/PBE endpoints (tools/mine_mace_embed_table.py); re-mine after the full re-opt

cif: ../../examples/cifs/CdSe_zb.cif
charges: {Cd: 2, Se: -2, Cl: -1}

nucleation:
  kmax: 13
  mode: exact
  core_monomer: {cation: Cd, anion: Se}
  precursor: {center: Cd, ligand: Cl, ligand_count: 2}
  site_tolerance: 0.2

relaxation:
  enabled: true
  backend: mace
  method: MACE-MH-1
  python: /Users/ivaninfante/miniforge3/envs/orchestr_ai-mace/bin/python
  model: /Users/ivaninfante/.cache/mace/macemh1model
  head: omat_pbe
  device: mps
  dtype: float32
  optimizer: BFGS
  fmax: 0.02
  # Energy-plateau stop: converged when the energy moved < 2 meV over the
  # last 5 BFGS steps (ranking resolution is tens of meV); fmax remains the
  # alternative stop.  Cuts the long force-convergence tail MACE otherwise
  # spends on already-settled geometries.
  energy_tol_eV: 0.002
  energy_window: 5
  energy_fmax_gate: 0.05
  # Measured on k=3 starts: ~45% fewer steps, <=8 meV vs strict fmax on
  # ordinary cases.  The rare 40-600 meV differences are basin transitions
  # (a genuine shallow minimum that strict BFGS creeps out of over ~200
  # steps) -- a search-policy matter, not a convergence one.
  max_steps: 500
  maxstep: 0.20
  accept_maxcycle: true
  timeout_s: 1800
  check_connectivity: true
  # Post-relax bond model.  MACE/PBE endpoints carry a 2.9-3.3 A Cd-Se
  # contact tail that the g-xTB-era single cutoff (3.25 A) cuts through;
  # two_tier builds chemistry/scaffold graphs on strong bonds (Cd-Se 2.95,
  # Cd-Cl 2.80) and reports the all-bond tier and long contacts alongside.
  # See docs/nucleation/mace_descriptors.md.  (auto == two_tier for mace.)
  descriptor_cutoffs: two_tier
  artifact_min_distance:
    Cd-Cd: 2.80
    Se-Se: 2.80
    Cl-Se: 2.80
    Cl-Cl: 2.80
