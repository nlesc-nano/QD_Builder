# Metric tables for zb occupation growth -- MACE-MH-1 (omat_pbe) / PBE
# endpoints.  Same schema and role as embed.yaml (g-xTB medians):
# after Cl is seeded on the CIF core, a short least_squares morphs
# core+Cl onto these lengths/angles; nothing here decides which graphs
# are built.
#
# Mined 2026-09-16 by tools/mine_mace_embed_table.py from
# 1301 relaxed structures ({'reopt': 1175, 'mace_from_dft': 126}), 0 excluded for
# artifact contacts; 28789 bonds, 54734 angles.
# k range 1-6; bond graph = two-tier strong cutoffs (Cd-Se 2.95, Cd-Cl 2.8).
# Observation counts per entry are in the .provenance.json sidecar.  dihedrals / rings /
# reconstruction are carried over from embed.yaml (geometric relations,
# not re-mined).  cl_seed.from_table makes the geometric Cl seed use the
# CdCl_terminal / CdCl_bridge radii below.
# Do not hand-edit numbers; re-run the miner.

