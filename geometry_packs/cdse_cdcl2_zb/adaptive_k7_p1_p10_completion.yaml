version: 3
chemistry_adapter: cdse_cdcl2
seed: 173205
workers: 24
max_calls: 800
launch_hours: 46
timeout_s: 1800
max_steps: 150
checkpoint_interval_batches: 10

# Targeted composition completion after Phase B.  Existing p1--p8 structures
# are imported unchanged; only p9/p10 endpoints are evaluated.  This run has
# no growth operation and cannot create k=8 structures.
enabled_phases: [B]
phase_a_k: [5, 6]
phase_b_k: 7
phase_c_k: 8
operation_calls:
  7: {fixed: 800}
family_slots: {7: 48}
p_max: {1: 3, 2: 5, 3: 6, 4: 7, 5: 8, 6: 9, 7: 10, 8: 11}

# Select only ligand-rich parents.  Exchange from p8 seeds p9 and exchange
# from p9 seeds p10; p9/p10 topology and reconstruction provide local repair.
parent_p_by_k: {7: [8, 9, 10]}
proposal_p_by_k: {7: [9, 10]}

# Require a minimally diverse map before plateau completion is allowed.  The
# p1--p8 conditions protect the inherited map; p9 and p10 are the active debt.
required_primary_families_by_p:
  7: {1: 3, 2: 3, 3: 3, 4: 3, 5: 3, 6: 3, 7: 3, 8: 3, 9: 5, 10: 3}

# The source currently supplies roughly 38 ligand-rich families.  Ten slots
# remain available for genuinely new p9/p10 families.
admission_fraction: 0.20
source_novelty_fraction: 0.0
subfamilies_per_family: 2
p_states_per_family: 3
geometries_per_family: 2
minimum_launched_cycles: 2

min_cycles: 2
max_cycles: 8
convergence_patience: 2
new_families_per_100_calls: 2.0
convergence_energy_window_eV: 1.0
energy_improvement_eV: 0.05
minimum_endpoint_fraction: 0.25
proposals_per_family_fixed: 4
proposals_per_family_growth: 6

primary_slots: 12
audit_slots: 2
audit_fraction: 0.10
bridge_prior: 0.80
proposals_per_move: 8
proposals_per_parent: 32
fixed_rounds: 0
