version: 3
chemistry_adapter: cdse_cdcl2
seed: 223607
workers: 24
max_calls: 4100
launch_hours: 46
timeout_s: 1800
max_steps: 150
checkpoint_interval_batches: 20
progress_interval_batches: 1

# Targeted continuation of Phase C.  The broad run established clean k8
# families through p8 but found only audit endpoints at p9--p11.  New cycle
# numbers prevent regeneration of the original cycle-0--7 queues.
enabled_phases: [C]
phase_a_k: [5, 6]
phase_b_k: 7
phase_c_k: 8
phase_cycle_start: {C: 8}
min_cycles: 10
max_cycles: 16

p_max: {1: 3, 2: 5, 3: 6, 4: 7, 5: 8, 6: 9, 7: 10, 8: 11}
parent_p_by_k:
  7: [8, 9, 10]
  8: [8, 9, 10, 11]
parent_roles_by_k:
  7: [primary]
  8: [primary, audit]
proposal_p_by_k:
  8: [9, 10, 11]

# Composition caps prevent productive low-p parents from consuming the
# frontier budget.  Totals match the operation caps below.
operation_calls:
  8: {growth: 1400, fixed: 2700}
operation_calls_by_p:
  8:
    growth: {9: 400, 10: 500, 11: 500}
    fixed: {9: 900, 10: 900, 11: 900}

# All targeted source families fit in these beams.  Primary reservations keep
# the clean p8 launchpad and k7 p8--p10 roots; role-agnostic reservations retain
# the repairable p9--p11 audit frontier.
family_slots: {7: 20, 8: 45}
cohort_min_primary_families_by_p:
  7: {8: 3, 9: 3, 10: 3}
  8: {8: 3}
cohort_min_families_by_p:
  8: {9: 10, 10: 5, 11: 1}
required_primary_families_by_p:
  8: {9: 3, 10: 3, 11: 3}

admission_fraction: 0.0
source_novelty_fraction: 0.0
subfamilies_per_family: 4
p_states_per_family: 4
geometries_per_family: 2
minimum_launched_cycles: 2

# Audit structures are deliberate repair parents in this protocol.  Their
# descendants remain tagged audit_derived even when the relaxed endpoint is
# rule-clean.
audit_fraction: 1.0
chemistry_options:
  fixed_channel_counts: {repair: 3, exchange: 2, topology: 1}

convergence_patience: 2
new_families_per_100_calls: 2.0
convergence_energy_window_eV: 1.0
energy_improvement_eV: 0.05
minimum_endpoint_fraction: 0.25
proposals_per_family_fixed: 6
proposals_per_family_growth: 8

primary_slots: 12
audit_slots: 2
bridge_prior: 0.80
proposals_per_move: 8
proposals_per_parent: 32
fixed_rounds: 0
