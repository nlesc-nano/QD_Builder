# CsPbBr3 cubic perovskite cube, 3 unit cells, Cs-centred.
charges: {Cs: 1, Pb: 2, Br: -1, Cl: -1}
size_unit_cells: [3.0, 3.0, 3.0]
construction_origin: {center_on_species: Cs}
passivation:
  ligand: Cl
  surf_tol: 2.0
  prepass_mode: role-aware
  prepass_min_cn_terrace: 3
  prepass_min_cn_edge: 2
  prepass_min_cn_vertex: 1
facets:
  - {hkl: "100", scope: family, gamma: 1.0}
symmetry: {proper_rotations_only: true}
