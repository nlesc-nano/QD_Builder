materials:
  - name: core
    cif: examples/cifs/ZnSe_zb.cif
    size_unit_cells: [3, 3, 1]
    facets:
      - hkl: "100"
        termination: cation_rich
        gamma: 1.0
      - hkl: "111"
        termination: cation_rich
        gamma: 1.0
      - hkl: "-1-1-1"
        termination: anion_rich
        gamma: 1.0
  - name: shell
    cif: examples/cifs/CdTe_zb.cif
    size_unit_cells: [0, 0, 1]
    facets:
      - hkl: "100"
        termination: cation_rich
        gamma: 1.0
      - hkl: "111"
        termination: cation_rich
        gamma: 1.0
      - hkl: "-1-1-1"
        termination: anion_rich
        gamma: 1.0

passivation:
  ligand: Cl
  surf_tol: 2.0

charges:
  Zn: +2
  Cd: +2
  Se: -2
  Te: -2
  Cl: -1

symmetry:
  proper_rotations_only: true

experimental:
  exhausted_positive_q_fallback: true
