[build-system]
requires = ["setuptools>=61.0", "wheel", "cython>=3.0", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "nanocrystal-builder"
version = "0.1.0"
description = "Wulff-construction nanocrystal builder with coordination-aware surface passivation"
readme = "README.md"
authors = [
  { name = "Ivan Infante" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "networkx>=3.0",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "pymatgen>=2023.7"
]

[project.optional-dependencies]
# Semi-empirical relaxation.  Installable from conda-forge (see
# environment.yml); the pip names exist but xtb-python builds from source,
# so conda/micromamba is strongly preferred on a cluster.
xtb = ["ase>=3.22", "xtb>=22.1"]
# Post-run analysis in tools/ and scripts/.
analysis = ["pandas>=2.0", "matplotlib>=3.7"]
test = ["pytest>=7.4"]
# Beam-search acceleration (optional native extension).
speed = ["cython>=3.0"]

[project.scripts]
nc-builder = "builder.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
