# ZnSe zinc-blende size series, swap variant of the {111} reconstruction:
# the default recipe, with the anion-terminated facets compensated by
# anion -> Cl swaps and ligands on the cation-terminated facets (no vacancies).
material: ZnSe
family: II-VI
phase: zinc-blende
cif: cifs/ZnSe_zb.cif
native_elements: [Zn, Se]
centres: [Zn, Se]
sizes: {start: 0.5, stop: 6.0, step: 0.25}   # unit cells, cubic
positive_q_mode: add
reconstruction: auto
reconstruction_pattern: swap      # outer anions -> Cl, compensated on the cation {111}
write_clean: false                # clean parents live in the default series
min_core_atoms: 20
min_interatomic_distance: 1.8      # Å
min_anion_fraction_kept: 0.5       # reconstructed variants keep >= this share of the clean anions
out_dir: out_swap

preset:
  charges: {Zn: 2, Se: -2, Cl: -1}
  passivation:
    ligand: Cl
    surf_tol: 2.0
    prepass_mode: role-aware
    prepass_min_cn_terrace: 3
    prepass_min_cn_edge: 2
    prepass_min_cn_vertex: 1
  facets:
    - {hkl: "100", scope: family, termination: cation_rich, gamma: 1.0}
    - {hkl: "111", scope: family, termination: cation_rich, gamma: 1.0}
    - {hkl: "-1-1-1", scope: family, termination: anion_rich, gamma: 1.0}
  symmetry: {proper_rotations_only: true}
