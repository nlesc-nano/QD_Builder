# CdSe zinc-blende size series for the QDSpace library.
# The preset mirrors the webapp Builder's II-VI default recipe.
material: CdSe
family: II-VI
phase: zinc-blende
cif: ../cifs/CdSe_zb.cif
native_elements: [Cd, Se]          # formula order; everything else is a ligand
centres: [Cd, Se]
sizes: {start: 0.5, stop: 6.0, step: 0.25}   # unit cells, cubic
positive_q_mode: add
reconstruction: auto               # auto: add a {111}-reconstructed variant when it applies
min_core_atoms: 20
min_interatomic_distance: 1.8      # Å
out_dir: out

preset:
  charges: {Cd: 2, Se: -2, Cl: -1}
  passivation:
    ligand: Cl
    surf_tol: 2.0
    prepass_mode: role-aware
    prepass_min_cn_terrace: 3
    prepass_min_cn_edge: 2
    prepass_min_cn_vertex: 1
  facets:
    - {hkl: "100", scope: family, termination: cation_rich, gamma: 1.0}
    - {hkl: "111", scope: family, termination: cation_rich, gamma: 1.0}
    - {hkl: "-1-1-1", scope: family, termination: anion_rich, gamma: 1.0}
  symmetry: {proper_rotations_only: true}
