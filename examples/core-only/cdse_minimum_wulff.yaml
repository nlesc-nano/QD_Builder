# Smallest faceted Wulff reference produced by the standard builder:
# Cd16Se13Cl6 = (CdSe)13(CdCl2)3.
size_unit_cells: [1, 1, 1]

facets:
  - hkl: "100"
    scope: family
    termination: cation_rich
    gamma: 1.0
  - hkl: "111"
    scope: family
    termination: cation_rich
    gamma: 1.0
  - hkl: "-1-1-1"
    scope: family
    termination: anion_rich
    gamma: 1.0

passivation:
  ligand: Cl
  surf_tol: 2.0
  prepass_mode: role-aware
  prepass_min_cn_terrace: 2
  prepass_min_cn_edge: 2
  prepass_min_cn_vertex: 1

charges:
  Cd: +2
  Se: -2
  Cl: -1

symmetry:
  proper_rotations_only: true

construction_origin:
  center_on_species: Se

experimental:
  exhausted_positive_q_fallback: true
