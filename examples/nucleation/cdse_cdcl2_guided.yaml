cif: ../cifs/CdSe_zb.cif

charges:
  Cd: +2
  Se: -2
  Cl: -1

nucleation:
  # Larger k than the exact example can reach, by giving up completeness in two
  # controlled places.  Raise kmax as far as your patience allows; cost now grows
  # with the number of skeletons rather than with the number of distinct ligand
  # arrangements, which is what made the exact run stop at k=3.
  kmax: 5

  # Guided passivation: bridging sites first, then undercoordinated Cd.
  # Multi-shell on the *same* skeleton:
  #   shell_score_layers = how many distinct scores to walk (20, then 19, …)
  #   shells_per_score_layer = top N within each score (1 = best only at that score)
  #   shells_per_skeleton = hard cap on total shells kept for that core
  # Set shells_per_skeleton=1 and shell_score_layers=1 for historical single shell.
  mode: guided
  shells_per_skeleton: 6
  shell_score_layers: 3
  shells_per_score_layer: 1
  shell_enum_max_assignments: 10000

  # Grow k=1..3 from every unique skeleton, then carry forward only the cores of
  # retained structures.  Distinct skeletons measured 4, 14, 243 at k=1, 2, 3 --
  # exponential, because most are open or branched arrangements rather than
  # compact dots.  Keeping those is right for a small nucleus and wrong once the
  # interior is bulk-like.
  exact_through_k: 3

  # When building destination k >= compact_from_k, keep only steepest-ascent
  # compact monomer attachments (max new Cd-Se bonds), and prefer ones that
  # close a zb 6-ring.  Start at k=5: DFT supports compact ring closure, while
  # the ultra-small nuclei should retain their exceptional open motifs.
  # Without this,
  # guided k=4 already spends most of its time on open lattice animals.
  core_growth_policy: compact_ring
  compact_from_k: 5

  # Cap skeletons per (k,p) so the p-ladder stays bounded (high-p acceleration).
  p_skeleton_beam: 24
  p_beam_from_k: 4
  p_beam_rank: fused_rings

  # Among compact k→k+1 children, prefer multi-chair (edge-fused 6-rings).
  fused_chair_from_k: 6
  fused_chair_mode: rank

  # Soft retain band: keep top 2 coordination-score layers (not winners-only)
  # so near-optimal lineages can still feed k→k+1.
  # Continuous growth cost ~ N_parents × N_packages × attachments × (1+shed).
  # Prefer modest per-bin caps once continuous_decoration is on.
  retain_score_layers: 2
  retain_max_per_bin: 8
  # Only the top-N retained by score grow further (export still keeps all 8).
  growth_max_parents_per_bin: 4

  # When k >= exact_through_k, place the next monomer on *passivated* parents:
  # Cl occupies tetrahedral sites and blocks those directions (no strip-first).
  core_growth_occupation: decorated
  # Keep the Cl shell across k: only shed/add on free sites (no full rebuild).
  continuous_decoration: true

  # Building-block growth: solution seeds are monomer packages (1, p_m).
  # Prefer DFT-favored p_m=1,2; omit bare 0 to cut a full package axis.
  monomer_p_values: [1, 2]
  parent_p_mode: all_retained
  p_ladder_mode: product_window

  # Scenario A surface Δp bounds (map design; chemical potentials later):
  #   p_surf(k) = floor(β k^(2/3))     β=3  (between conservative 1.5 and ~4.5)
  #   s_max     = min(p, floor(α p_surf(k)))   α=1
  #   p_child   ≤ min(p + p_m, p_surf(k+1)); the unshed shell p-s remains
  #   bound and the local pool s+p_m may be re-adsorbed
  #   ladder p_cap ≤ p_surf(k)  (not CN ceiling 3k)
  # Optional hard caps still apply if set > 0 (0 = no extra hard shed/add cap).
  p_surf_beta: 3.0
  shed_alpha: 1.0
  k_growth_max_shed: 0
  k_growth_max_add: -1

  # After Cl placement + bridges, prefer winners with Cl-containing 4/6 rings.
  # Placement is unchanged; Cl 4-rings still require min_bridged_host_cn: 3.
  passivation_ring_policy: prefer_cl_rings
  ring_lengths: [4, 6]

  core_monomer:
    cation: Cd
    anion: Se
  precursor:
    center: Cd
    ligand: Cl
    ligand_count: 2
  site_tolerance: 0.20

  geometry_rules:
    Cd:
      cn2: linear
      cn3: trigonal_planar
      cn4: tetrahedral
    Se:
      all: tetrahedral
    Cl:
      all: tetrahedral

  graph_rules:
    min_cn:
      Cd: 2
      Se: 2
      Cl: 1
    max_cn:
      Cd: 4
      Se: 4
      Cl: 2
    allowed_bonds:
      - [Cd, Se]
      - [Cd, Cl]
    bridging:
      Cl:
        host: Cd
        shared_neighbor: Se
        surface_angle_deg: 90.0
        # Same DFT-backed rule as the exact example -- see cdse_cdcl2.yaml.
        min_bridged_host_cn: 3
