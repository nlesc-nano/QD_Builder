# Rock-salt IV–VI smoke: PbSe + PbCl2 packages (kmax=1).
# Same policy pack as pbs_pbcl2_k1.yaml with Se anion.
cif: ../cifs/PbSe.cif

charges:
  Pb: +2
  Se: -2
  Cl: -1

nucleation:
  kmax: 1
  mode: exact
  core_growth_policy: all
  passivation_ring_policy: none
  discarded_through_k: 1

  lattice_policy:
    inorganic_ring_length: 4
    geometry_defaults: none
  surface_geometry:
    terminal_motifs: none

  core_monomer:
    cation: Pb
    anion: Se
  precursor:
    center: Pb
    ligand: Cl
    ligand_count: 2
  site_tolerance: 0.25

  geometry_rules:
    Pb:
      cn2: linear
      cn4: tetrahedral
      cn6: octahedral
    Se:
      all: octahedral
    Cl:
      all: tetrahedral

  graph_rules:
    min_cn:
      Pb: 2
      Se: 2
      Cl: 1
    max_cn:
      Pb: 6
      Se: 6
      Cl: 2
    allowed_bonds:
      - [Pb, Se]
      - [Pb, Cl]
    bridging:
      Cl:
        host: Pb
        shared_neighbor: Se
        surface_angle_deg: 90.0
        min_bridged_host_cn: 1
