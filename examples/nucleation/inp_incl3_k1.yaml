# Minimal InP exact smoke (kmax=1) for fast load/CN/bridge checks.
cif: ../cifs/InP_zb.cif

charges:
  In: +3
  P: -3
  Cl: -1

nucleation:
  kmax: 1
  mode: exact
  core_growth_policy: all
  passivation_ring_policy: none
  # III–V not DFT-calibrated for the CdSe terminal table.
  surface_geometry:
    terminal_motifs: none

  core_monomer:
    cation: In
    anion: P
  precursor:
    center: In
    ligand: Cl
    ligand_count: 3
  site_tolerance: 0.20

  geometry_rules:
    In:
      cn3: trigonal_planar
      cn4: tetrahedral
    P:
      all: tetrahedral
    Cl:
      all: tetrahedral

  graph_rules:
    min_cn:
      In: 3
      P: 2
      Cl: 1
    max_cn:
      In: 4
      P: 4
      Cl: 2
    allowed_bonds:
      - [In, P]
      - [In, Cl]
    bridging:
      Cl:
        host: In
        shared_neighbor: P
        surface_angle_deg: 90.0
        min_bridged_host_cn: 3
