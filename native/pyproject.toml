[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "nanocrystal-builder-native"
version = "0.1.0"
description = "Optional C++ kernels for nanocrystal-builder (the builder runs without them)"
authors = [{ name = "Ivan Infante" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/qdb_native"]
cmake.build-type = "Release"
